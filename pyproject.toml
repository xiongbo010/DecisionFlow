[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decisionflow"
version = "0.1.0"
description = "Compile declarative business workflows into structured probabilistic decision flows"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Bo Xiong"}]
keywords = [
    "agents",
    "decision-making",
    "probabilistic-inference",
    "structured-prediction",
    "workflows",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/xiongbo010/DecisionFlow"
Documentation = "https://github.com/xiongbo010/DecisionFlow#readme"
Repository = "https://github.com/xiongbo010/DecisionFlow.git"
Issues = "https://github.com/xiongbo010/DecisionFlow/issues"

[project.optional-dependencies]
sdd = ["PySDD>=1.0.0"]
dev = ["pytest>=7", "pytest-cov>=4"]
all = ["PySDD>=1.0.0"]

[project.scripts]
decisionflow = "decisionflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
