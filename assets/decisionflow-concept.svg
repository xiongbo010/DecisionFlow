<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc">
  <title id="title">Typed Decisions compared with DecisionFlow structured decisions</title>
  <desc id="desc">Typed Decisions return separate local probability distributions. DecisionFlow represents a joint distribution over complete three-step decision flows, with ribbon width showing joint probability, node size showing marginal probability, and a highlighted Joint MAP path.</desc>
  <defs>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfbf8"/>
    </linearGradient>
    <linearGradient id="coralCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff2ef"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.58" stop-color="#07164f"/>
      <stop offset="0.59" stop-color="#1d88f5"/>
      <stop offset="1" stop-color="#0076ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#21436f" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#1685f4" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1685f4"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#12ad9b"/>
    </marker>
    <marker id="arrowCoral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ff6757"/>
    </marker>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#087ced"/>
    </marker>
    <style>
      .font { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .navy { fill: #07164f; }
      .panel { fill: #fbfdff; stroke: #dceafa; stroke-width: 1.5; }
      .small { font-size: 20px; font-weight: 600; }
      .label { font-size: 24px; font-weight: 700; }
      .heading { font-size: 55px; font-weight: 800; letter-spacing: -1.5px; }
      .caption { font-size: 27px; font-weight: 750; }
    </style>
  </defs>

  <rect width="1800" height="760" fill="#ffffff"/>

  <g class="font navy">
    <text x="450" y="78" text-anchor="middle" class="heading">Typed Decisions</text>
    <text x="1350" y="78" text-anchor="middle" class="heading">Structured Decisions</text>

    <rect x="28" y="112" width="842" height="555" rx="34" class="panel"/>
    <rect x="930" y="112" width="842" height="555" rx="34" class="panel"/>

    <!-- Left: shared input -->
    <g filter="url(#shadow)">
      <rect x="52" y="262" width="225" height="190" rx="20" fill="#ffffff" stroke="#bedcff" stroke-width="1.5"/>
      <rect x="52" y="262" width="225" height="64" rx="20" fill="#f5f9ff"/>
      <path d="M52 306h225" stroke="#e5effa"/>
    </g>
    <text x="164" y="301" text-anchor="middle" class="label">Shared Input</text>
    <path d="M73 353h25 M73 362h25 M73 371h25" stroke="#07164f" stroke-width="3" stroke-linecap="round"/>
    <text x="112" y="369" font-size="22" font-weight="650">State x</text>
    <path d="M75 408c0-9 9-16 20-16s20 7 20 16-9 16-20 16c-3 0-6 0-9-1l-10 7 3-12c-3-3-4-6-4-10z" fill="none" stroke="#07164f" stroke-width="2.6"/>
    <text x="124" y="407" font-size="20" font-weight="650">
      <tspan x="124" dy="0">Typed</tspan>
      <tspan x="124" dy="23">Questions Q</tspan>
    </text>

    <!-- Left arrows -->
    <path d="M277 327 C305 327 298 208 330 208" fill="none" stroke="#1685f4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <path d="M277 358 C304 358 304 355 330 355" fill="none" stroke="#12ad9b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
    <path d="M277 390 C305 390 298 502 330 502" fill="none" stroke="#ff6757" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowCoral)"/>

    <!-- Left decision cards -->
    <g filter="url(#shadow)">
      <rect x="330" y="143" width="500" height="135" rx="22" fill="url(#blueCard)" stroke="#a8d3ff" stroke-width="1.5"/>
      <rect x="330" y="290" width="500" height="135" rx="22" fill="url(#tealCard)" stroke="#a8eadf" stroke-width="1.5"/>
      <rect x="330" y="437" width="500" height="135" rx="22" fill="url(#coralCard)" stroke="#ffc6be" stroke-width="1.5"/>
    </g>
    <circle cx="390" cy="210" r="38" fill="#d8ebff"/>
    <path d="M373 211l36-20-13 39-8-12z" fill="#1685f4" stroke="#0874dd" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="390" cy="357" r="38" fill="#d7f7f1"/>
    <path d="M390 337l18 7v14c0 13-8 22-18 27-10-5-18-14-18-27v-14z" fill="#21b8a7" stroke="#078e82" stroke-width="2.5"/>
    <path d="M390 343v34" stroke="#d9fff8" stroke-width="3"/>
    <circle cx="390" cy="504" r="38" fill="#ffe1dc"/>
    <path d="M396 480l-21 29h14l-6 22 24-31h-15z" fill="#ff6757"/>

    <text x="440" y="201" font-size="30" font-weight="780">Route</text>
    <rect x="440" y="215" width="100" height="38" rx="14" fill="#d8eaff"/>
    <text x="490" y="241" text-anchor="middle" font-size="21" font-weight="650" fill="#0874dd">Choice</text>
    <text x="440" y="348" font-size="30" font-weight="780">Fraud</text>
    <rect x="440" y="362" width="100" height="38" rx="14" fill="#d5f6f0"/>
    <text x="490" y="388" text-anchor="middle" font-size="21" font-weight="650" fill="#078e82">Noul</text>
    <text x="440" y="495" font-size="30" font-weight="780">Urgency</text>
    <rect x="440" y="509" width="100" height="38" rx="14" fill="#ffe0da"/>
    <text x="490" y="535" text-anchor="middle" font-size="21" font-weight="650" fill="#e9483a">Score</text>

    <!-- Local bar charts -->
    <g stroke="#07164f" stroke-width="3">
      <path d="M585 251V170 M585 251H790"/><path d="M585 398V317 M585 398H790"/><path d="M585 545V464 M585 545H790"/>
    </g>
    <g fill="#4c9af2"><rect x="598" y="170" width="34" height="81" rx="2"/><rect x="646" y="198" width="34" height="53" rx="2" opacity=".82"/><rect x="694" y="222" width="34" height="29" rx="2" opacity=".65"/><rect x="742" y="235" width="34" height="16" rx="2" opacity=".52"/></g>
    <g fill="#28b9aa"><rect x="598" y="317" width="34" height="81" rx="2"/><rect x="646" y="345" width="34" height="53" rx="2" opacity=".82"/><rect x="694" y="369" width="34" height="29" rx="2" opacity=".65"/><rect x="742" y="382" width="34" height="16" rx="2" opacity=".52"/></g>
    <g fill="#ff7365"><rect x="598" y="464" width="34" height="81" rx="2"/><rect x="646" y="492" width="34" height="53" rx="2" opacity=".82"/><rect x="694" y="516" width="34" height="29" rx="2" opacity=".65"/><rect x="742" y="529" width="34" height="16" rx="2" opacity=".52"/></g>

    <!-- Right: wordmark and shared input -->
    <text x="1365" y="168" text-anchor="middle" font-size="52" font-weight="820" fill="url(#wordmark)" letter-spacing="-1.2">DecisionFlow</text>
    <g filter="url(#shadow)">
      <rect x="950" y="264" width="220" height="188" rx="20" fill="#ffffff" stroke="#bedcff" stroke-width="1.5"/>
      <rect x="950" y="264" width="220" height="64" rx="20" fill="#f5f9ff"/>
      <path d="M950 308h220" stroke="#e5effa"/>
    </g>
    <text x="1060" y="302" text-anchor="middle" class="label">Shared Input</text>
    <path d="M972 355h25 M972 364h25 M972 373h25" stroke="#07164f" stroke-width="3" stroke-linecap="round"/>
    <text x="1012" y="371" font-size="22" font-weight="650">State x</text>
    <path d="M974 410c0-9 9-16 20-16s20 7 20 16-9 16-20 16c-3 0-6 0-9-1l-10 7 3-12c-3-3-4-6-4-10z" fill="none" stroke="#07164f" stroke-width="2.6"/>
    <text x="1020" y="409" font-size="20" font-weight="650">
      <tspan x="1020" dy="0">Typed</tspan>
      <tspan x="1020" dy="23">Questions Q</tspan>
    </text>

    <!-- Right input arrows -->
    <path d="M1170 325 C1190 325 1190 280 1215 280" fill="none" stroke="#1685f4" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <path d="M1170 357 C1190 357 1190 365 1215 365" fill="none" stroke="#12ad9b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
    <path d="M1170 390 C1190 390 1190 450 1215 450" fill="none" stroke="#ff6757" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowCoral)"/>

    <!-- Time labels and guides -->
    <text x="1245" y="226" text-anchor="middle" font-size="26" font-weight="700" font-style="italic">t = 1</text>
    <text x="1450" y="226" text-anchor="middle" font-size="26" font-weight="700" font-style="italic">t = 2</text>
    <text x="1650" y="226" text-anchor="middle" font-size="26" font-weight="700" font-style="italic">t = 3</text>
    <g stroke="#75baff" stroke-width="1.5" stroke-dasharray="8 8" opacity=".8"><path d="M1245 238V498"/><path d="M1450 238V498"/><path d="M1650 238V498"/></g>

    <!-- Probability ribbons: each full ribbon represents a decision world -->
    <g fill="none" stroke-linecap="round">
      <path d="M1245 280 C1330 280 1365 265 1450 265 S1570 280 1650 280" stroke="#96caff" stroke-width="35" opacity=".36"/>
      <path d="M1245 280 C1320 290 1375 315 1450 315 S1570 292 1650 280" stroke="#1685f4" stroke-width="16" opacity=".98" marker-end="url(#arrowNavy)"/>
      <path d="M1245 280 C1325 305 1370 365 1450 365 S1570 330 1650 280" stroke="#35bde0" stroke-width="10" opacity=".65"/>
      <path d="M1245 280 C1330 320 1365 425 1450 425 S1570 380 1650 365" stroke="#6bb5ec" stroke-width="7" opacity=".34"/>
      <path d="M1245 280 C1320 270 1375 295 1450 315 S1570 345 1650 365" stroke="#9c7ae8" stroke-width="6" opacity=".28"/>
      <path d="M1245 365 C1320 345 1370 265 1450 265 S1570 335 1650 365" stroke="#59d3ca" stroke-width="9" opacity=".48"/>
      <path d="M1245 365 C1325 365 1370 365 1450 365 S1570 365 1650 365" stroke="#12ad9b" stroke-width="14" opacity=".88"/>
      <path d="M1245 365 C1325 385 1370 425 1450 425 S1570 395 1650 365" stroke="#55c7bd" stroke-width="8" opacity=".45"/>
      <path d="M1245 365 C1325 390 1370 450 1450 450 S1570 438 1650 450" stroke="#5bc6bd" stroke-width="6" opacity=".30"/>
      <path d="M1245 365 C1320 330 1375 315 1450 315 S1570 405 1650 450" stroke="#718ee2" stroke-width="7" opacity=".28"/>
      <path d="M1245 450 C1325 440 1370 425 1450 425 S1570 440 1650 450" stroke="#ff6757" stroke-width="13" opacity=".86"/>
      <path d="M1245 450 C1325 425 1370 365 1450 365 S1570 405 1650 450" stroke="#ff8b7f" stroke-width="8" opacity=".43"/>
      <path d="M1245 450 C1320 415 1375 315 1450 315 S1570 325 1650 365" stroke="#d28bdd" stroke-width="6" opacity=".30"/>
      <path d="M1245 450 C1325 455 1370 450 1450 450 S1570 450 1650 450" stroke="#ff9b91" stroke-width="7" opacity=".38"/>
      <path d="M1245 450 C1325 405 1370 265 1450 265 S1570 300 1650 280" stroke="#9fb9ed" stroke-width="5" opacity=".25"/>
    </g>

    <!-- Marginal nodes: size encodes marginal probability -->
    <g>
      <circle cx="1245" cy="280" r="31" fill="#e7f3ff" stroke="#7dbafa" stroke-width="8" opacity=".72"/>
      <circle cx="1245" cy="280" r="24" fill="#1685f4" stroke="#086fd4" stroke-width="2.5" filter="url(#glow)"/>
      <circle cx="1245" cy="365" r="24" fill="#22b8aa" stroke="#078e82" stroke-width="2.5"/>
      <circle cx="1245" cy="450" r="24" fill="#ff6757" stroke="#df382b" stroke-width="2.5"/>

      <circle cx="1450" cy="265" r="35" fill="#e5f2ff" stroke="#7dbafa" stroke-width="8" opacity=".72"/>
      <circle cx="1450" cy="265" r="27" fill="#1685f4" stroke="#086fd4" stroke-width="2.5" filter="url(#glow)"/>
      <circle cx="1450" cy="315" r="16" fill="#bfa8f2" stroke="#7a58d2" stroke-width="2"/>
      <circle cx="1450" cy="365" r="23" fill="#22b8aa" stroke="#078e82" stroke-width="2.5"/>
      <circle cx="1450" cy="425" r="13" fill="#ff9b91" stroke="#ef6457" stroke-width="2"/>
      <circle cx="1450" cy="450" r="19" fill="#ff6757" stroke="#df382b" stroke-width="2.5"/>

      <circle cx="1650" cy="280" r="38" fill="#e5f2ff" stroke="#7dbafa" stroke-width="8" opacity=".72"/>
      <circle cx="1650" cy="280" r="29" fill="#1685f4" stroke="#086fd4" stroke-width="2.5" filter="url(#glow)"/>
      <circle cx="1650" cy="365" r="28" fill="#22b8aa" stroke="#078e82" stroke-width="2.5"/>
      <circle cx="1650" cy="450" r="24" fill="#ff6757" stroke="#df382b" stroke-width="2.5"/>
    </g>

    <!-- Joint MAP callout -->
    <rect x="1640" y="145" width="112" height="42" rx="12" fill="#1685f4"/>
    <text x="1696" y="173" text-anchor="middle" font-size="20" font-weight="750" fill="#ffffff">Joint MAP</text>
    <path d="M1683 188 C1680 208 1670 232 1660 250" fill="none" stroke="#1685f4" stroke-width="4" marker-end="url(#arrowBlue)"/>

    <!-- Legend -->
    <rect x="955" y="520" width="792" height="118" rx="20" fill="#ffffff" stroke="#d7e8fa" stroke-width="1.5"/>
    <path d="M978 570 C1000 548 1028 592 1053 570" fill="none" stroke="#6ab3f6" stroke-width="23" opacity=".55"/>
    <text x="1070" y="557" font-size="20" font-weight="700">Ribbon width:</text><text x="1070" y="584" font-size="20" font-weight="600">joint probability</text>
    <path d="M1240 540V618" stroke="#c9ddf5" stroke-width="2"/>
    <circle cx="1295" cy="578" r="25" fill="#e5f2ff" stroke="#80bcf6" stroke-width="6"/><circle cx="1295" cy="578" r="17" fill="#1685f4"/>
    <text x="1335" y="557" font-size="20" font-weight="700">Node size:</text><text x="1335" y="584" font-size="20" font-weight="600">marginal probability</text>
    <path d="M1518 540V618" stroke="#c9ddf5" stroke-width="2"/>
    <path d="M1548 578h63" stroke="#1685f4" stroke-width="14" marker-end="url(#arrowNavy)"/>
    <text x="1620" y="548" font-size="20" font-weight="700">Highlighted</text>
    <text x="1620" y="572" font-size="20" font-weight="600">path:</text>
    <text x="1620" y="596" font-size="20" font-weight="700">Joint MAP</text>

    <text x="450" y="724" text-anchor="middle" class="caption">Probabilistic distributions of individual decisions</text>
    <text x="1350" y="724" text-anchor="middle" class="caption">Probabilistic distributions of complete possible decision flows</text>
  </g>
</svg>
